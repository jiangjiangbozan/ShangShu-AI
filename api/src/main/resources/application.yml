# ====================================================================
# 智能助手 AI 开放平台 - 后端公共配置（所有环境共享）
# 严格遵循《企业Java后端开发规范.md》
# ====================================================================
spring:
  application:
    name: ai-agent-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 自动装配排除：项目仅用 Ollama embedding（nomic-embed-text）做 RAG 向量化。
  # OpenAI starter 也会装配 openAiEmbeddingModel，导致 ElasticsearchVectorStoreAutoConfiguration
  # 因找到 2 个 EmbeddingModel 候选而启动失败。排除后 OllamaEmbeddingModel 成为唯一候选。
  # 如未来需切换到 OpenAI embedding，删除此项并在 spring.ai.model.embedding.openai 配置 model 即可。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
  # Jackson 统一日期格式（规范 §3.6）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 16MB

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  # Tomcat 线程配置
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000
  # 优雅停机
  shutdown: graceful

# MyBatis-Plus 数据访问层（团队强制 DAL 规范，见 design.md D6）
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ai.api.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    default-fetch-size: 100
    default-statement-timeout: 30
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
      table-underline: true

# 大模型配置（见 design.md D7）
ai:
  model:
    deep-seek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model-id: deepseek-chat
      enabled: true
    qwen:
      api-key: ${QWEN_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      model-id: qwen-plus
      enabled: true
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-id: ${OLLAMA_MODEL_ID:qwen3:8b}
      enabled: ${OLLAMA_ENABLED:true}

  # 网络搜索增强（默认关闭；启用后客户端可传 webSearch=true 注入实时搜索结果）
  # provider: tavily（需 API Key，推荐）| searxng（自建实例，无需 Key）
  web-search:
    enabled: ${WEB_SEARCH_ENABLED:false}
    provider: ${WEB_SEARCH_PROVIDER:tavily}
    api-key: ${TAVILY_API_KEY:}
    api-url: ${WEB_SEARCH_API_URL:https://api.tavily.com/search}
    timeout-ms: 5000
    max-results: 5
    max-content-chars: 500

# Spring AI RabbitMQ 配置（异步写入 LLM 日志）
spring.ai:
  # 阻止 Spring AI 自动创建 ChatClient Bean（我们使用 ChatClientFactory 按需创建）
  chat:
    client:
      enabled: false

# Actuator 健康检查与监控（见 design.md D4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# springdoc OpenAPI 文档（见 design.md D4）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.ai.api
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# 日志（logback-spring.xml 接管具体格式）
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.ai.api: DEBUG
    org.springframework: INFO
    com.baomidou.mybatisplus: DEBUG
